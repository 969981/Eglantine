# Lichii nx2: preserve the historical Eglantine branches, mirror source safely, and
# explicitly dispatch the release workflow after GITHUB_TOKEN merges (which do not
# trigger push-based Actions). Upstream CI workflow changes require separate review.
name: Lichii | Sync upstream nx2 and launch releases

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Dispatch a build even if Lichii nx2 did not change"
        type: boolean
        default: false
  push:
    branches: [nx2]
    paths:
      - ".github/workflows/lichii-nx2-sync.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: lichii-nx2-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Safe non-force merge of zortos293/Lichii nx2
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      source: ${{ steps.sync.outputs.source }}
      merged: ${{ steps.sync.outputs.merged }}
    steps:
      - name: Check out our nx2 branch, with full history
        uses: actions/checkout@v4
        with:
          ref: nx2
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true
      - name: Fetch Lichii nx2 and merge without rewriting local history
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin nx2
          git switch -C nx2 origin/nx2
          git remote add lichii https://github.com/zortos293/Lichii.git
          git fetch --no-tags lichii refs/heads/nx2
          before="$(git rev-parse HEAD)"
          upstream="$(git rev-parse FETCH_HEAD)"
          echo "Lichii upstream: $upstream"
          echo "Local nx2 before sync: $before"
          echo "source=$upstream" >> "$GITHUB_OUTPUT"
          # Mirror source content as an incremental commit, not the original
          # upstream commit ancestry: the Actions token cannot push upstream
          # commits that modify workflows even if the final tree restores ours.
          state=.github/lichii-nx2-upstream.sha
          if [ -f "$state" ]; then
            previous="$(cat "$state")"
          else
            previous="$(git merge-base HEAD "$upstream")"
          fi
          test -n "$previous" && git cat-file -e "$previous^{commit}"
          if [ "$previous" = "$upstream" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Lichii nx2 source already synchronized."
          else
            if ! git merge-base --is-ancestor "$previous" "$upstream"; then
              echo "::error::Lichii upstream history was rewritten. Review before syncing."
              exit 1
            fi
            patch="$RUNNER_TEMP/lichii-nx2-upstream.patch"
            git diff --binary "$previous" "$upstream" -- . ':(exclude).github/workflows/**' > "$patch"
            source_changed=false
            if [ -s "$patch" ]; then
              if ! git apply --3way --index "$patch"; then
                mapfile -d '' -t conflicted < <(git diff --name-only -z --diff-filter=U)
                if [ "${#conflicted[@]}" -eq 0 ]; then
                  echo "::error::Patch failed without resolvable conflicts; refusing sync."
                  exit 1
                fi
                for path in "${conflicted[@]}"; do
                  case "$path" in
                    # The same two upstream-source overrides were reviewed in
                    # the previous merge-based workflow.
                    src/core/arm/dynarmic/window_trace.h|src/shader_recompiler/frontend/ampere/lower_to_maxwell.h)
                      git show "$upstream:$path" > "$path"
                      git add -- "$path"
                      echo "Resolved reviewed source conflict: $path" >> "$GITHUB_STEP_SUMMARY"
                      ;;
                    *)
                      echo "::error::Unreviewed source conflict: $path"
                      exit 1
                      ;;
                  esac
                done
              fi
              if ! git diff --cached --quiet; then source_changed=true; fi
            fi
            printf '%s\n' "$upstream" > "$state"
            git add -- "$state"
            if git diff --cached --name-only | grep -q '^.github/workflows/'; then
              echo '::error::Sync bot must not change local workflow files.'
              exit 1
            fi
            git commit -m "chore(sync): Lichii nx2 source $upstream"
            git push origin HEAD:refs/heads/nx2
            echo "changed=$source_changed" >> "$GITHUB_OUTPUT"
          fi
          merged="$(git rev-parse HEAD)"
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          {
            echo "Lichii nx2 source: $upstream"
            echo "Local nx2 merged commit: $merged"
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-build:
    name: Dispatch 7-platform Lichii release build when upstream changes
    needs: sync
    if: needs.sync.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch the nx2 release matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GH_REPO" --jq '.default_branch')"
          if [ "$default_branch" != "nx2" ]; then
            echo "::error::Default branch must remain nx2; actual default is $default_branch."
            exit 1
          fi
          # workflow_dispatch is an allowed downstream trigger from GITHUB_TOKEN;
          # the source-merge push alone intentionally does not trigger Actions.
          gh workflow run release-binaries.yml --repo "$GH_REPO" --ref nx2 -f publish_release=true
          echo "Dispatched 7-platform Lichii release build on $GH_REPO/nx2." >> "$GITHUB_STEP_SUMMARY"
