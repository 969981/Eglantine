name: Prune legacy Eglantine releases (one-time)

on:
  push:
    branches: [nx2]
    paths:
      - ".github/workflows/prune-legacy-releases.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == '969981/Lichii'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Remove only six verified Eglantine upstream releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_ids=(433486179 432396750 432313979 430778407 430413583 429975888)
          for id in "${release_ids[@]}"; do
            payload="$(gh api "repos/$GH_REPO/releases/$id")"
            name="$(jq -r '.name' <<< "$payload")"
            tag="$(jq -r '.tag_name' <<< "$payload")"
            if [[ "$name" != 'Eglantine upstream '* || "$tag" != upstream-* ]]; then
              echo "::error::Refusing to delete $id: name=$name tag=$tag"
              exit 1
            fi
          done
          for id in "${release_ids[@]}"; do
            gh api --method DELETE "repos/$GH_REPO/releases/$id"
            echo "Deleted legacy release $id" >> "$GITHUB_STEP_SUMMARY"
          done
          # Intentionally keep all Git tags and build-N Lichii releases.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | [.id, .tag_name, .name] | @tsv' >> "$GITHUB_STEP_SUMMARY"
