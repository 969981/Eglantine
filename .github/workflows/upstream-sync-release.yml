# Bootstrap migration from the historical Eglantine master sync to the Lichii nx2 fork.
# After the user selects nx2 as default, .github/workflows/lichii-nx2-sync.yml takes over.
name: Bootstrap Lichii nx2 upstream synchronization

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches:
      - "2ndAdjustmentVulkanV3-STOP_FORCE_PUSHING_CAMILLE"
    paths:
      - ".github/workflows/upstream-sync-release.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: lichii-nx2-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Merge Lichii nx2 into the existing nx2 branch without force
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nx2
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: true
      - name: Fetch Lichii nx2 and preserve original Eglantine branch history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin nx2
          git switch -C nx2 origin/nx2
          git remote add lichii https://github.com/zortos293/Lichii.git
          git fetch --no-tags lichii refs/heads/nx2
          before="$(git rev-parse HEAD)"
          source="$(git rev-parse FETCH_HEAD)"
          echo "Current local nx2: $before"
          echo "Lichii nx2: $source"
          if git merge-base --is-ancestor "$source" HEAD; then
            echo "Already synchronized; no new commit required."
          else
            if ! git merge --no-edit --no-ff "$source"; then
              git merge --abort || true
              echo "::error::Lichii nx2 merge has conflicts. Keeping original nx2 unchanged."
              exit 1
            fi
            git push origin HEAD:refs/heads/nx2
          fi
          merged="$(git rev-parse HEAD)"
          echo "Synced nx2 to $merged" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream Lichii: $source" >> "$GITHUB_STEP_SUMMARY"
      - name: Remind about the one-time default-branch switch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current="$(gh api "repos/$GH_REPO" --jq '.default_branch')"
          echo "Current default: $current" >> "$GITHUB_STEP_SUMMARY"
          if [ "$current" != "nx2" ]; then
            echo "::notice::Switch default branch to nx2 in Settings > General > Default branch. The nx2-native scheduled sync workflow is already installed."
          fi
